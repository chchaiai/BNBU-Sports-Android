      allOf:
        - { $ref: "#/components/schemas/EmailContactRequest" }
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: '^\\d{6}$' }
    VerifyPhoneContactRequest:
      allOf:
        - { $ref: "#/components/schemas/PhoneContactRequest" }
